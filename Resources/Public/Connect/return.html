<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>My Store Locator – connected</title>
<style>
  body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#101B30;background:#f6f5ff;display:flex;min-height:100vh;align-items:center;justify-content:center}
  main{background:#fff;border-radius:14px;padding:28px 32px;max-width:440px;box-shadow:0 6px 30px rgba(16,27,48,.08)}
  h1{font-size:18px;margin:0 0 8px}
  code{display:block;margin:12px 0;padding:10px 12px;background:#f1eeff;border-radius:8px;font-size:15px;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1 id="t">Connecting …</h1>
  <p id="m">This window closes by itself.</p>
  <code id="c" hidden></code>
</main>
<script>
/* Return page of the My Store Locator connect flow (shared by the PHP CMS integrations).
   The app sends the browser here with ?msl_token=…&msl_map=…&state=…; this page hands the values to the admin
   window that opened the popup (same origin only) and closes. No data leaves the browser. */
(function () {
  var q = new URLSearchParams(location.search), token = q.get('msl_token') || '', map = q.get('msl_map') || '', state = q.get('state') || '';
  var ok = /^[A-Za-z0-9_-]{6,64}$/.test(token), t = document.getElementById('t'), m = document.getElementById('m'), c = document.getElementById('c');
  if (!ok) { t.textContent = 'No map token received'; m.textContent = 'Please close this window and paste the map token manually.'; return; }
  var msg = { type: 'msl:connect', token: token, map: map, state: state };
  function done() {
    t.textContent = 'Map connected'; m.textContent = map ? 'Map "' + map + '" was selected. You can close this window.' : 'You can close this window.';
    setTimeout(function () { window.close(); }, 600);
  }
  function manual() {
    t.textContent = 'Copy your map token';
    m.textContent = 'Paste this token into the map token field of the My Store Locator settings:';
    c.textContent = token; c.hidden = false;
  }
  if (window.opener && !window.opener.closed) {
    try { window.opener.postMessage(msg, location.origin); done(); return; } catch (e) { /* fall through */ }
  }
  /* Joomla (and other CMS) send "Cross-Origin-Opener-Policy: same-origin", which cuts window.opener once the popup
     visited app.my-store-locator.com. Fallback: same-origin BroadcastChannel; the admin form answers with an ack. */
  if ('BroadcastChannel' in window) {
    var bc = new BroadcastChannel('msl-connect'), acked = false;
    bc.onmessage = function (e) { if (e.data && e.data.type === 'msl:connect:ack' && e.data.state === state) { acked = true; bc.close(); done(); } };
    bc.postMessage(msg);
    setTimeout(function () { if (!acked) { bc.close(); manual(); } }, 1500);
    return;
  }
  manual();
})();
</script>
</body>
</html>
